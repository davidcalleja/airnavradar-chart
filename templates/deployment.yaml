apiVersion: apps/v1
kind: Deployment
metadata:
  name: airnavradar
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "airnavradar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "airnavradar.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: rbfeeder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
            - secretRef:
                name: {{ .Values.sharingKeySecretName }}
            - secretRef:
                name: {{ .Values.coordinatesSecretName }}
            - secretRef:
                name: {{ .Values.timezoneSecretName }}